<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郭秉軒 Orbit Kuo | 數位名片</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --line-green: #06c755;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    h1 {
      font-size: 24px;
      color: var(--text-main);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .patent-box {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 22px;
    }
    .patent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .patent-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
    }
    .patent-badge {
      font-size: 11px;
      background: rgba(245, 158, 11, 0.2);
      color: var(--gold);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .patent-no {
      font-size: 12px;
      color: #cbd5e1;
      font-family: monospace;
      letter-spacing: 0.03em;
    }
    .section-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 22px;
    }
    .tag {
      background: #0f172a;
      color: #cbd5e1;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .contact-list {
      list-style: none;
      margin-bottom: 24px;
    }
    .contact-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .contact-label { color: var(--text-muted); }
    .contact-value { 
      color: var(--text-main); 
      text-decoration: none; 
      font-weight: 500; 
      word-break: break-all;
    }
    .contact-value:hover { color: var(--accent); }
    .line-value { color: var(--line-green); }
    .line-value:hover { text-decoration: underline; }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--accent);
      color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-line {
      background: var(--line-green);
      color: #ffffff;
    }
    .btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Hardware Trust & Edge Computing</div>
    <h1>郭秉軒 <span style="font-size:18px; font-weight:400; color:var(--text-muted);">Orbit Kuo</span></h1>
    <div class="subtitle">邊緣運算與智慧邊境資料 / 碳資產存證架構師</div>

    <!-- 專利申請中區塊 -->
    <div class="patent-box">
      <div class="patent-header">
        <span class="patent-title">碳資產邊緣黑盒子存證系統</span>
        <span class="patent-badge">專利申請中 Patent Pending</span>
      </div>
      <!-- 填入台一提供的申請案號，若尚未拿到案號也可先顯示「發明專利審查中」 -->
      <div class="patent-no">申請案號：115141632（發明專利）</div>
    </div>

    <div class="section-title">核心技術領域</div>
    <div class="tags">
      <span class="tag">EU CBAM 7318</span>
      <span class="tag">TPM 2.0 硬體簽章</span>
      <span class="tag">DuckDB 邊緣運算</span>
      <span class="tag">WORM 防篡改</span>
      <span class="tag">Modbus/RS-485 直連</span>
    </div>

    <div class="section-title">聯絡資訊</div>
    <ul class="contact-list">
      <li class="contact-item">
        <span class="contact-label">行動電話</span>
        <a class="contact-value" href="tel:0958391352">0958-391-352</a>
      </li>
      <li class="contact-item">
        <span class="contact-label">LINE ID</span>
        <a class="contact-value line-value" href="https://line.me/R/ti/p/~orbitkuo" target="_blank">orbitkuo</a>
      </li>
      <li class="contact-item">
        <span class="contact-label">Email</span>
        <a class="contact-value" href="mailto:orbitkuo@gmail.com">orbitkuo@gmail.com</a>
      </li>
      <li class="contact-item">
        <span class="contact-label">地點</span>
        <span class="contact-value">台北 / 台灣</span>
      </li>
    </ul>

    <div class="btn-group">
      <a class="btn btn-line" href="https://line.me/R/ti/p/~orbitkuo" target="_blank">加 LINE 好友</a>
      <button class="btn" onclick="saveVCard()">加入通訊錄 (.vcf)</button>
    </div>
  </div>

  <script>
    function saveVCard() {
      const phone = "0958391352";
      const lineId = "orbitkuo";
      const patentInfo = "碳資產邊緣黑盒子存證系統 (發明專利申請中, 案號:115141632 )";

      const vcard = `BEGIN:VCARD
VERSION:3.0
N:郭;秉軒;;;
FN:郭秉軒 (Orbit Kuo)
TITLE:邊緣運算架構師 / CBAM 數據合規
TEL;TYPE=CELL:${phone}
EMAIL;TYPE=INTERNET,WORK:orbitkuo@gmail.com
NOTE:LINE ID: ${lineId}\\n技術專利: ${patentInfo}\\n專長領域: 歐盟 CBAM 扣件(CN 7318)合規解析、TPM 2.0硬體簽章、DuckDB邊緣計算、邊境風控
ADR;TYPE=WORK:;;台北市;;;台灣
END:VCARD`;

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", "Orbit_Kuo.vcf");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
